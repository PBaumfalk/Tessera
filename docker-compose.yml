# Tessera starten:   docker compose up -d --build
# Protokoll:         docker compose logs -f tessera
name: tessera

services:
  tessera:
    build: .
    image: tessera:1.0.0
    restart: unless-stopped
    init: true
    ports:
      - "${TESSERA_PORT:-8080}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - tessera-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tessera-data:
