# Testumgebung für die OIDC-Anmeldung mit einem echten OIDC-Testanbieter (navikt/mock-oauth2-server).
# Start:  docker compose -p tessera-oidc -f docker-compose.yml -f tests/oidc/docker-compose.oidc.yml up -d
services:
  tessera:
    ports: !override
      - "8091:3000"
    environment:
      APP_URL: http://localhost:8091
      OIDC_ISSUER: http://host.docker.internal:8095/default
      OIDC_CLIENT_ID: tessera
      OIDC_CLIENT_SECRET: geheim
      OIDC_ALLOW_INSECURE: "true"
      OIDC_ADMIN_GROUPS: tessera-admins
      OIDC_BUTTON_LABEL: Mit Testanbieter anmelden
      AUTH_LOCAL: "true"
      ADMIN_EMAIL: admin@firma.test
      ADMIN_PASSWORD: lokales-passwort-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8095:8080"
